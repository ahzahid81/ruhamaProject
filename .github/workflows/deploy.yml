name: Deploy Ruhama Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "======================================"
            echo "Starting Ruhama Project deployment..."
            echo "======================================"

            cd /var/www/ruhamaProject

            echo ">>> Backing up production .env"
            if [ -f server/.env ]; then cp server/.env /tmp/ruhama-server.env; fi

            echo ">>> Syncing repository to origin/main"
            git fetch origin
            git reset --hard origin/main

            echo ">>> Removing generated node_modules (recreated by npm ci)"
            rm -rf server/node_modules client/node_modules

            echo ">>> Restoring production .env"
            if [ -f /tmp/ruhama-server.env ]; then cp /tmp/ruhama-server.env server/.env; fi

            echo "======================================"
            echo "Backend deployment"
            echo "======================================"

            cd /var/www/ruhamaProject/server

            echo ">>> Installing backend dependencies"
            npm ci --omit=dev

            echo ">>> Restarting backend"
            pm2 restart ruhama-backend

            echo ">>> Saving PM2 process list"
            pm2 save

            echo "======================================"
            echo "Frontend deployment"
            echo "======================================"

            cd /var/www/ruhamaProject/client

            echo ">>> Installing frontend dependencies"
            npm ci

            echo ">>> Building frontend"
            npm run build

            echo "======================================"
            echo "Reloading Nginx"
            echo "======================================"

            nginx -t
            systemctl reload nginx

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
